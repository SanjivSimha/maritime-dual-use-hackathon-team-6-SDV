# Mission-priority file (input, swappable). Guest weights come from each card's capability
# level for this mission; overrides pin a guest's weight explicitly.
id: survey_primary
mission: survey
levels: {high: "$priority.level.high", medium: "$priority.level.medium", low: "$priority.level.low"}
overrides: {}
mission_critical_threshold: "$priority.mission_critical_threshold"
protect_arbitration_winner: true
