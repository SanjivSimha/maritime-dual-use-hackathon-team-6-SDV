class: Anything else
assumptions:
  - id: guests.g2.standby_kw
    value: 1.0
    unit: kW
    why: The card gives no standby draw; logger and buffers stay alive.
    source: invented
  - id: guests.g3.survey_speed_lo_kn
    value: 2.5
    unit: kn
    why: Card says surveying at 3 kn; we allow ±0.5 kn.
    source: invented
  - id: guests.g3.survey_speed_hi_kn
    value: 3.5
    unit: kn
    why: See guests.g3.survey_speed_lo_kn.
    source: invented
  - id: guests.g3.recovery_min
    value: 15
    unit: min
    why: Recovering the vehicle up the ramp; the card only gives 45 min for a full swap.
    source: invented
  - id: guests.g3.suspend_window_min
    value: 75
    unit: min
    why: A suspended leg can only restart after recovery (15 min) and the non-interruptible 60-min recharge.
    source: derived from B.G3 + guests.g3.recovery_min
  - id: guests.g4.topping_min
    value: 30
    unit: min
    why: The card says 35 kW for 20 min "then 10 kW"; we end the 10 kW phase after 30 min.
    source: invented
  - id: guests.g4.landing_approach_min
    value: 3
    unit: min
    why: Final approach and touchdown once the ship is in the flight-deck state.
    source: invented
  - id: guests.g4.launch_min
    value: 3
    unit: min
    why: Same as the approach.
    source: invented
  - id: guests.g5.antenna_height_m
    value: 0.4
    unit: m
    why: A 0.3 m² comms antenna; used for the hangar-roof drone-clearance check.
    source: invented
  - id: guests.g6.mass_t
    value: 2.4
    unit: t
    range: [1.8, 3.0]
    why: "A 10-ft medical container (two stretchers, warming, oxygen) weighs 1.8–3 t; fits a Bay 1 half (≤ 4 t) or Bay 2."
    source: invented (G6 is a team-6 card)
  - id: guests.g6.standby_kw
    value: 3
    unit: kW
    range: [2, 4]
    why: "Climate control and charged medical equipment kept ready while no one is aboard the module."
    source: invented (G6 is a team-6 card)
  - id: guests.g6.treating_kw
    value: 18
    unit: kW
    range: [12, 25]
    why: "Two patients: forced-air warming 2 × 3 kW, oxygen concentrators 2 × 1.5 kW, HVAC 6 kW, monitors 3 kW."
    source: invented (G6 is a team-6 card)
  - id: guests.g6.compressor_peak_kw
    value: 10
    unit: kW
    range: [5, 15]
    why: "Inrush when the HVAC and oxygen compressors start; exercises the A.1 peak rule."
    source: invented (G6 is a team-6 card)
  - id: guests.g6.compressor_peak_s
    value: 20
    unit: s
    range: [10, 30]
    why: "Compressor start transient; well inside the A.1 60 s peak tolerance."
    source: invented (G6 is a team-6 card)
  - id: guests.g6.satcom_mbps
    value: 1
    unit: Mbit/s
    range: [0.5, 2]
    why: "Telemedicine video at low resolution plus vital-sign telemetry."
    source: invented (G6 is a team-6 card)
  - id: guests.g6.backbone_mbps
    value: 50
    unit: Mbit/s
    range: [10, 100]
    why: "Monitor feeds to the bridge and the edge node."
    source: invented (G6 is a team-6 card)
  - id: guests.g6.install_people
    value: 4
    unit: people
    range: [3, 4]
    why: "Same crane-and-hook-up crew as the other bay guests (B.G2, B.G5)."
    source: invented (G6 is a team-6 card)
  - id: guests.g6.install_h
    value: 4
    unit: h
    range: [4, 8]
    why: "Lower end of A.11's 4–8 h per bay guest: plug-in container, no winch to commission."
    source: invented (G6 is a team-6 card)
