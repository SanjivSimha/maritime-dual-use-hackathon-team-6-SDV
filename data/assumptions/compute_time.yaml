class: Compute · Response time
assumptions:
  - {id: compute.g1.cores, value: 4, unit: cores, why: Signal processing for a passive RF sensor., source: invented}
  - {id: compute.g1.mem_gb, value: 8, unit: GB, why: See compute.g1.cores., source: invented}
  - {id: compute.g2.cores, value: 2, unit: cores, why: Profile processing and buffering., source: invented}
  - {id: compute.g2.mem_gb, value: 4, unit: GB, why: See compute.g2.cores., source: invented}
  - {id: compute.g3.cores, value: 8, unit: cores, why: Sonar and imagery post-processing on the cradle., source: invented}
  - {id: compute.g3.mem_gb, value: 32, unit: GB, why: See compute.g3.cores., source: invented}
  - {id: compute.g3.accelerators, value: 1, unit: accelerators, why: Imagery inference for cable / pipeline inspection., source: invented}
  - {id: compute.g4.cores, value: 8, unit: cores, why: Video ingest and detection., source: invented}
  - {id: compute.g4.mem_gb, value: 16, unit: GB, why: See compute.g4.cores., source: invented}
  - {id: compute.g4.accelerators, value: 1, unit: accelerators, why: Person-in-water detection on drone video., source: invented}
  - {id: compute.g5.cores, value: 4, unit: cores, why: The node brings its own edge compute; the rack only hosts its control plane., source: invented}
  - {id: compute.g5.mem_gb, value: 16, unit: GB, why: See compute.g5.cores., source: invented}
  - id: placement.margin_tie_tolerance
    value: 0.01
    unit: normalised margin
    why: Placements whose minimum margins differ by less than 1 % are treated as equal, so the flexibility and preference criteria decide instead of noise.
    source: invented
  - id: placement.max_candidates
    value: 200000
    unit: assignments
    why: Solver budget guard. The five-card problem has fewer than 100 assignments; above this limit the search refuses rather than blowing the 30 s ceiling.
    source: invented
  - id: placement.alternatives_reported
    value: 3
    unit: options
    why: D2 must show the alternatives considered; three are enough for an operator to see why the choice won.
    source: invented
  - id: admission.max_restrictions
    value: 3
    unit: actions
    why: Fix sets for one admission are searched up to three throttle / standby / off / interlock actions. Beyond that the answer is a displacement, and the search stays well under the 30 s ceiling.
    source: invented
  - id: admission.alternatives_reported
    value: 4
    unit: options
    why: The ranked yes-if list shows the chosen fix plus up to four costlier ones.
    source: invented
  - id: time.s_per_min
    value: 60
    unit: s/min
    why: Unit conversion.
    source: definition
  - id: time.min_per_h
    value: 60
    unit: min/h
    why: Unit conversion.
    source: definition
  - id: time.s_per_h
    value: 3600
    unit: s/h
    why: Unit conversion.
    source: definition
  - id: time.min_per_day
    value: 1440
    unit: min/day
    why: Unit conversion. Losing an asset costs its weight × the mission minutes left without it.
    source: definition
  - id: units.percent
    value: 100
    unit: "%"
    why: Unit conversion for battery percentages.
    source: definition
  - id: display.minute_decimals
    value: 1
    unit: decimals
    why: Minutes are reported to 0.1 min in decisions.
    source: invented
  - id: shed.horizon_min
    value: 30
    unit: min
    why: D4 forecasts the guests' scheduled modes 30 min ahead, so an overlap that has not started yet (a 60-min non-interruptible recharge, a 20-min drone charge) is resolved before it trips the last genset.
    source: invented
  - id: shed.first_action_s
    value: 1
    unit: s
    why: The first shed command leaves 1 s after the trip is detected (A.8 ceiling 5 s).
    source: invented
  - id: shed.step_interval_s
    value: 2
    unit: s
    why: Each later step waits 2 s so the remaining genset settles between steps. Up to 30 steps still fit in the 60 s full-sequence ceiling.
    source: invented
  - id: shed.min_relief_kw
    value: 0.1
    unit: kW
    why: Avoids dividing by zero when ranking an armed step that relieves nothing at the current peak.
    source: invented
  - id: display.kw_decimals
    value: 2
    unit: decimals
    why: kW figures in decisions are reported to 0.01 kW.
    source: invented
